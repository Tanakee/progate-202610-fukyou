x-rails: &rails
  image: ruby:3.4
  working_dir: /app
  volumes:
    - ./backend:/app
    - gems:/usr/local/bundle
  environment:
    DB_HOST: db
    DB_USERNAME: app
    DB_PASSWORD: local_dev_password
    REDIS_URL: redis://redis:6379/1
    SPEED_SCALE: "1"

services:
  app:
    <<: *rails
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        bundle install &&
        ruby bin/rails db:prepare &&
        exec ruby bin/rails server -b 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 60

  ticker:
    <<: *rails
    # gem のインストールと DB の準備は app に任せる。同じボリュームへ同時にインストールすると壊れるため
    depends_on:
      app:
        condition: service_healthy
    command: ["ruby", "bin/rails", "ticker:run"]

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: fukyou_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "fukyou_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gems:
  postgres_data:
