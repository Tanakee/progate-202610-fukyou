x-rails: &rails
  image: ruby:3.4
  working_dir: /app
  volumes:
    - ./backend:/app
    - gems:/usr/local/bundle
  environment:
    DB_HOST: db
    DB_USERNAME: app
    DB_PASSWORD: local_dev_password
    REDIS_URL: redis://redis:6379/1
    SPEED_SCALE: "1"

services:
  app:
    <<: *rails
    image: fukyou-app-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command:
      - bash
      - -c
      - |
        bundle install &&
        ruby bin/rails db:prepare &&
        rm -f tmp/pids/server.pid &&
        exec ruby bin/rails server -b 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 60

  wind:
    <<: *rails
    # gem のインストールと DB の準備は app に任せる。同じボリュームへ同時にインストールすると壊れるため
    depends_on:
      app:
        condition: service_healthy
    command: ["ruby", "bin/rails", "wind:fetch"]
    restart: unless-stopped

  balloons:
    <<: *rails
    depends_on:
      app:
        condition: service_healthy
    command: ["ruby", "bin/rails", "balloons:move"]
    restart: unless-stopped

  realtime:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ./realtime:/app
      - go_modules:/go/pkg/mod
    environment:
      PGHOST: db
      PGUSER: app
      PGPASSWORD: local_dev_password
      PGDATABASE: fukyou_development
      SPEED_SCALE: "1"
    ports:
      - "127.0.0.1:4000:4000/udp"
    # テーブルを作るのは app の db:prepare なので、それを待つ
    depends_on:
      app:
        condition: service_healthy
    command: ["go", "run", "."]
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: fukyou_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "fukyou_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 公式のイメージを使わないのは、コミュニティ版の配布が止まり、ソースしか公開されていないから
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: fukyou-minio:local
    # バケットを作るためだけに mc を足さず、データの置き場所にフォルダーを先に作ってバケットにする
    entrypoint: ["sh", "-c", "mkdir -p /data/fukyou-development && exec minio server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      default:
        # Rails が署名付き URL に入れるホスト名。Mac（シミュレーター）からも同じ名前で届く
        aliases:
          - minio.localhost

  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gems:
  go_modules:
  postgres_data:
  minio_data:
