# アラートの閾値。Grafana の Alerting と、ダッシュボードの「発生中のアラート」で見る
groups:
  - name: containers
    rules:
      - alert: ContainerHighCpu
        # 上限に張り付くと、5秒ごとの定期処理が間に合わなくなる
        expr: |
          sum by (service) (rate(container_cpu_usage_seconds_total[1m]))
            / on (service) max by (service) (container_spec_cpu_quota / container_spec_cpu_period)
            > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} の CPU が上限の80%を超えています（{{ $value | humanizePercentage }}）"

      - alert: ContainerHighMemory
        # 上限に達すると OOM で強制終了される
        expr: |
          max by (service) (container_memory_working_set_bytes)
            / on (service) max by (service) (container_spec_memory_limit_bytes > 0)
            > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} のメモリが上限の90%を超えています（{{ $value | humanizePercentage }}）"

      - alert: ContainerMissing
        # 止まったコンテナの系列は5分残るので、absent だけだと気づくのが5分遅れる。最後に見えた時刻でも判定する
        expr: |
          time() - max by (service) (container_last_seen{service=~"app|wind|balloons|db|redis|minio"}) > 60
            or absent(container_last_seen{service="app"})
            or absent(container_last_seen{service="wind"})
            or absent(container_last_seen{service="balloons"})
            or absent(container_last_seen{service="db"})
            or absent(container_last_seen{service="redis"})
            or absent(container_last_seen{service="minio"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} のコンテナが動いていません"

  - name: batches
    rules:
      - alert: BatchStalled
        # 間隔（balloons:move は5秒、wind:fetch は1分）の何回分も成功していなければ止まっている
        expr: |
          time() - batch_last_success_timestamp_seconds{batch="balloons:move"} > 60
            or time() - batch_last_success_timestamp_seconds{batch="wind:fetch"} > 300
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.batch }} が {{ $value | humanizeDuration }} 成功していません"

      - alert: BatchFailing
        expr: increase(batch_runs_total{result="failure"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.batch }} が直近5分に {{ $value | printf \"%.0f\" }} 回失敗しました"

      - alert: BatchOverrunning
        # 1回が間隔より長いと、次の回が飛ばされて風船の動きが飛び飛びになる
        expr: batch_last_duration_seconds{batch="balloons:move"} > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "balloons:move の1回が {{ $value | printf \"%.1f\" }} 秒かかり、5秒の間隔に収まっていません"

  - name: api
    rules:
      - alert: ApiDown
        expr: probe_success{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API（/up）に応答がありません"

      - alert: ApiSlow
        expr: probe_duration_seconds{job="api"} > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API（/up）の応答に {{ $value | printf \"%.2f\" }} 秒かかっています"
